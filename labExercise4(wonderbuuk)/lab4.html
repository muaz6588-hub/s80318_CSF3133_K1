<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lab Exercise 4 - Responsive Webpage</title>
	<link rel="stylesheet" href="style.css">
	
	<style>
	</style>
</head>
<body>

   <header>
    <h1>Web Page Lab Exercise 4</h1>
	<p>Responsive Webpage Html and Css</p>
   </header>
		
   <nav>
       <ul>
	      <li><a href="#home">Home</li>
		  <li><a href="#media">Media</li>
		  <li><a href="#form-section">Form</li>
	   </ul>
   </nav>
   
   <section id="home">
     <h2>Welcome</h2>
	 <div class="internal-box">
	    <p>This message is styled using internal CSS.</p>
	 </div>
	 <article>
        <h3>About Semantics</h3>
        <p>Semantic tags help structure web content clearly and logically.</p>
      </article>
   </section>
   
   <section id="media">
       <h2>Embedded Video</h2>
       <article>
            <h3>Sample Video</h3>
            <video controls width="100%">
                <source src="Upin & Ipin - Selamat Hari Raya Aidiladha.mp4" type="video/mp4">
                <track src="captions.vtt" kind="subtitles" srclang="en" label="English" default>
                 Your browser does not support the video tag.
            </video>
       </article>
   </section>
   
   <section id="form-section">
        <h2>Feedback Form</h2>
        <article>
            <form action="#" method="POST">
   
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
			<div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
			<div class="form-group">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male" class="inline">Male</label>
                        
                <input type="radio" id="female" name="gender" value="female">
                <label for="female" class="inline">Female</label>
            </div>
			<div class="form-group">
                <label>Favorite Hobbies:</label>
                <input type="checkbox" id="hobby1" name="hobbies" value="coding">
                <label for="hobby1" class="inline">Coding</label>
                        
                <input type="checkbox" id="hobby2" name="hobbies" value="reading">
                <label for="hobby2" class="inline">Reading</label>
            </div>
			
			<button type="submit">Submit</button>
		</form>
	  </article>
	</section>	
	
		<footer>
		   <p>&copy; 2026 Lab Exercise 4</p>
        </footer>		
</body>
</html>
