<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>e-Café Campus</title>
    <style type="text/css">
        /* Fixed Error 1: Replaced HTML comment with correct CSS comment syntax */
        /* Navigation bar */
        ul {
            /* Fixed Error 2: Changed invalid 'no' value to 'none' */
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        a:link {color: #1A5276;}
        a:hover {color: #E67E22;}
        a:visited {color: #7D3C98;}
        a:active {color: #C0392B;}
        /* Fixed Error 3: Changed invalid 'overlined' value to 'overline' */
        h1 {text-decoration: overline;}
        p {color: #333333; text-align: justify;}
        #intro {
            font-size: 18px;
            background-color: #FDEBD0;
        }
        /* Fixed Error 4: Added dot selector for class 'highlight' */
        .highlight {
            font-weight: bold;
            color: #C0392B;
        }
    </style>
</head>
<body>
<header>
    <h1>e-Café Campus</h1>
</header>
<nav>
    <ul>
        <!-- Fixed Error 5: Added '#' to make it jump to the menu section -->
        <li><a href="#menu">Menu</a></li>
        <li><a href="#video">Video</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>
<section id="menu">
    <h2>Today's Menu</h2>
    <p id="intro">Freshly brewed coffee and local delights every day.</p>
    <!-- Fixed Error 6: Changed duplicate id="item" to class="item" -->
    <article class="item">
        <h3>Kopi Tarik</h3>
        <p>Only <span class="highlight">RM 3.50</span></p>
    </article>
    <!-- Fixed Error 6: Changed duplicate id="item" to class="item" -->
    <article class="item">
        <h3>Nasi Lemak</h3>
        <p>Only <span class="highlight">RM 5.00</span></p>
    </article>
</section>
<section id="video">
    <h2>Watch Our Story</h2>
    <!-- Fixed Error 7 & 8: Added 'controls' attribute and correct 'video/mp4' type -->
    <video width="400" height="300" controls>
        <source src="cafe.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</section>
<footer id="contact">
    <p>&copy; 2026 e-Café Campus</p>
</footer>
</body>
</html>
